name: Check

permissions:
  contents: read

on:
  pull_request:
    branches: ["main"]
    # Converting to a draft or closing cancels the in-flight run through the concurrency group.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]

# Cancel a superseded run so a newer push to the PR frees its runner.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: ${{ github.event.action != 'closed' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # No GitHub Actions Nix cache: its entries are scoped to each PR, so every PR
      # uploads the closure again, and the binary caches serve a cold shell faster.
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            accept-flake-config = true
      - run: nix develop --command bash -c 'just check && just build'
